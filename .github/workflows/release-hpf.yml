name: Release HPF Workbench

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate on committed release conformance
        working-directory: tools/hpf-engine
        run: python check_contract.py ../../exports/latest.json

      - name: Verify committed index
        run: |
          python -c "import json; d = json.load(open('exports/latest.index.json')); assert d.get('objects'); print('index ok:', len(d['objects']))"

      - name: Assemble site data from committed release
        run: |
          mkdir -p website-hpf/data
          cp exports/latest.json website-hpf/data/export.json
          cp exports/latest.index.json website-hpf/data/index.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website-hpf --project-name=versatilesparks-hpf

