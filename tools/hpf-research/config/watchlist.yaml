# HPF Research Watchlist — operational configuration, not automation.
#
# Schema: hpf-watchlist-v1
#
# Canonical ids are vendor-independent and stable (tech.<domain>.<name>);
# vendor identities live in `name` and can change without rewriting history.
# Matching is identifier-based: an entry matches a topic when a normalized
# alias appears as a word-bounded token in the normalized topic, or a
# normalized keyword equals an alias. Never substring matching.
#
# Validation (enforced by tools/hpf-research/watchlist.py --check and at
# load time): schema must match, ids unique, aliases present and unique,
# no empty sections, type required.
#
# This is configuration only: no cron, no discovery, no scoring. When (and
# if) the parked Research Opportunity Engine is activated by measured
# evidence (chronicle entry 27), this list becomes its seed. Seed metadata
# (priority, sources, rss, reddit) is deliberately NOT here yet.

schema: hpf-watchlist-v1

topics:
  browser-automation:
    - id: tech.browser.fara
      name: Microsoft Fara
      aliases: [fara, fara1.5, fara ai]
      type: computer-use agent
    - id: tech.browser.nodriver
      name: ultrafunkamsterdam/nodriver
      aliases: [nodriver]
      type: driver
    - id: tech.browser.playwright
      name: Microsoft Playwright
      aliases: [playwright, playwright-python]
      type: framework
    - id: tech.browser.browserbase
      name: Browserbase
      aliases: [browser base]
      type: platform
    - id: tech.browser.browseruse
      name: Browser Use
      aliases: [browser use, browseruse]
      type: framework
    - id: tech.browser.stagehand
      name: Stagehand
      aliases: [stagehand ai]
      type: framework
    - id: tech.browser.cdp
      name: Chrome DevTools Protocol
      aliases: [cdp, chrome devtools]
      type: protocol
    - id: tech.browser.chromium
      name: Chromium
      aliases: [chromium browser]
      type: engine
    - id: tech.browser.selenium
      name: Selenium
      aliases: [selenium webdriver]
      type: framework
    - id: tech.browser.puppeteer
      name: Puppeteer
      aliases: [puppeteer js]
      type: framework
    - id: tech.browser.undetected-chromedriver
      name: undetected-chromedriver
      aliases: [uc, undetected chromedriver]
      type: driver
    - id: tech.browser.playwright-mcp
      name: Playwright MCP
      aliases: [playwright mcp]
      type: tool

  ai-agents:
    - id: tech.agents.openai
      name: OpenAI
      aliases: [openai agents, chatgpt]
      type: vendor
    - id: tech.agents.anthropic
      name: Anthropic
      aliases: [claude, anthropic claude]
      type: vendor
    - id: tech.agents.mcp
      name: Model Context Protocol
      aliases: [mcp, model context protocol]
      type: protocol
    - id: tech.agents.foundry
      name: Microsoft Foundry
      aliases: [foundry, azure foundry]
      type: platform
    - id: tech.agents.magentic
      name: Magentic
      aliases: [magentic ui, magentic-lite]
      type: framework
    - id: tech.agents.cua
      name: Computer Use Agents
      aliases: [cua, computer use agent, computer use]
      type: domain

  web-platform:
    - id: tech.web.chrome
      name: Google Chrome
      aliases: [google chrome]
      type: engine
    - id: tech.web.firefox
      name: Mozilla Firefox
      aliases: [mozilla firefox]
      type: engine
    - id: tech.web.webkit
      name: WebKit
      aliases: [safari webkit]
      type: engine
    - id: tech.web.cloudflare
      name: Cloudflare
      aliases: [cloudflare anti-bot]
      type: vendor
    - id: tech.web.w3c
      name: W3C
      aliases: [w3c standard]
      type: standards
    - id: tech.web.bots
      name: Anti-Bot / Bot Management
      aliases: [bot management, anti-bot, antibot]
      type: domain
