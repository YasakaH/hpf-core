# HPF Research Watchlist — operational configuration, not automation.
#
# Schema: hpf-watchlist-v1
#
# Canonical ids are vendor-independent and stable (tech.<domain>.<name>);
# vendor identities live in `name` and can change without rewriting history.
# Matching is identifier-based: an entry matches a topic when a normalized
# alias appears as a word-bounded token in the normalized topic, or a
# normalized keyword equals an alias. Never substring matching.
#
# `sources` is WHERE TO LOOK for each tracked technology (chronicle entry
# 32): inert data consumed by humans and by manual tools such as
# discover.py. It is NOT the Research Opportunity Engine — no scheduling,
# no scoring, no cron, nothing runs against it autonomously. Unknown source
# keys are rejected at load.
#
# Validation (enforced by tools/hpf-research/watchlist.py --check and at
# load time): schema must match, ids unique, aliases present and unique,
# no empty sections, type required, sources keys from the fixed vocabulary.
#
# This is configuration only. When (and if) the parked Research
# Opportunity Engine is activated by measured evidence (chronicle entry
# 27), this list — including its sources — becomes the seed.

schema: hpf-watchlist-v1

topics:
  browser-automation:
    - id: tech.browser.fara
      name: Microsoft Fara
      aliases: [fara, fara1.5, fara ai]
      type: computer-use agent
