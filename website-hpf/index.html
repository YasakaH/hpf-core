<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>HPF Research Workbench</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">HPF <span class="muted">Research Workbench</span></div>
    <div class="topbar-right">
      <span id="topbar-status" class="topbar-status"></span>
      <a id="portal-link" class="topbar-link hidden" target="_blank" rel="noopener">Portal</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="nav-group">
        <div class="nav-label">Workspace</div>
        <button class="nav-btn" data-route="#/">Home</button>
        <button class="nav-btn" data-route="#/research">Research</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Knowledge</div>
        <button class="nav-btn" data-route="#/library">Library</button>
        <button class="nav-btn" data-route="#/findings">Findings</button>
        <button class="nav-btn" data-route="#/publish">Publish</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Corpus</div>
        <button class="nav-btn" data-route="#/validation">Corpus Quality</button>
      </div>
      <div class="nav-group">
        <div class="nav-label">System</div>
        <button class="nav-btn" data-route="#/diagnostics">Diagnostics</button>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Find a concept…" autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </nav>

    <main id="main" class="main"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
